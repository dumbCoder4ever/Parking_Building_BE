# Database - Railway MySQL (Public)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://thomas.proxy.rlwy.net:26455/railway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:IRSTfgJbOEtPfvmGMVrydOcQTjBlwmoK}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Schema - validate để kiểm tra schema, không tự động tạo/xóa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.schema_validation_mode=skip
spring.jpa.properties.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.schema_validation_mode=never
# Connection pool - QUAN TRỌNG NHẤT
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=ParkingHikariPool

# Hibernate perf tweaks for slow remote DB
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Spring Cache (Caffeine) - in-memory cache for read-mostly data
spring.cache.type=caffeine
spring.cache.cache-names=vehicleTypes,pricingPolicies,buildings,floors,zones,slotConfigs
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

