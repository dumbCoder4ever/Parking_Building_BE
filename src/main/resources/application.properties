spring.application.name=parkingmanagement

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/parking_db
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=8f4a1b9c2d7e6f5a4b3c2d1e9f8a7b6c123456789abcdef
jwt.expiration=86400000

# WebSocket
spring.websocket.path=/ws

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.com.parking=DEBUG

# Log all requests and responses
spring.web.log-request-details=true

# Disable Spring Security's default headers to see more details
spring.security.filter.dispatcher-types=request,error,async,forward
