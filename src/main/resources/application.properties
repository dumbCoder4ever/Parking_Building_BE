# ==================== SQL Performance Tracking ====================
# Bật 2 dòng dưới để ĐẾM SỐ QUERY khi test API (đo N+1)
# Sau khi fix xong có thể comment lại để giảm log spam
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Format SQL gọn, dễ đếm
logging.pattern.console=%d{HH:mm:ss.SSS} %-5p [%t] : %m%n
# ============================================================

# Log all requests and responses
spring.web.log-request-details=true

# Disable Spring Security's default headers to see more details
spring.security.filter.dispatcher-types=request,error,async,forward

