spring.application.name=parkingmanagement
server.port=${SERVER_PORT:8080}

# Business timezone (Vietnam). Railway/JVM defaults to UTC without this.
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
spring.jackson.time-zone=${app.timezone}
spring.jpa.properties.hibernate.jdbc.time_zone=${app.timezone}

# ==================== Parking Configuration ====================
parking.max-car-hours=336
parking.max-motorbike-hours=168
parking.grace-period-minutes=30
# ============================================================

# ==================== VNPay ====================
# Sandbox: đăng ký tại https://sandbox.vnpayment.vn/
# Production: đổi vnp_PayUrl và vnp_ApiUrl sang URL thật
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
# Đổi return-url khi deploy (phải HTTPS, VNPay không chấp nhận localhost cho IPN)
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
vnpay.locale=vn
vnpay.curr-code=VND
# ===============================================

# ==================== Frontend ====================
frontend.url=${FRONTEND_URL:https://parking-building-management.vercel.app/}
# ================================================

# ==================== PayOS ====================
# Lấy credentials tại https://my.payos.vn
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.log-level=${PAYOS_LOG_LEVEL:NONE}
# Đổi URL khi deploy (dùng ngrok cho local test)
payos.return-url=${PAYOS_RETURN_URL:https://parking-building-management.vercel.app/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:https://parking-building-management.vercel.app/payment/cancel}
# Webhook URL đăng ký trên my.payos.vn hoặc gọi POST /api/payments/payos/confirm-webhook
# payos.webhook-url=https://proofs-rice-expose.ngrok-free.dev/api/payments/payos/webhook
# ===============================================

# Swagger UI: keep operation order from OpenAPI spec (not alphabetical)
springdoc.swagger-ui.operations-sorter=

# ==================== Database ====================
# Railway MySQL - Production
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Schema - validate để kiểm tra schema, không tự động tạo/xóa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.schema_validation_mode=skip
spring.jpa.properties.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.schema_validation_mode=never
# Connection pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=ParkingHikariPool

# Hibernate perf tweaks for slow remote DB
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Spring Cache (Caffeine) - in-memory cache for read-mostly data
# Per-cache TTL (dashboardStats=30s) is set in CacheConfig; this is the default fallback.
spring.cache.type=caffeine
spring.cache.cache-names=vehicleTypes,pricingPolicies,buildings,floors,zones,slotConfigs,dashboardStats,revenueDashboard,buildingsAvailable,buildingFloors,managerBuildings,managerFloors,managerZones,managerSlots
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
# ===============================================

# ==================== Cloudinary ====================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# ===============================================

# ==================== WebSocket ====================
spring.websocket.path=/ws
# ===============================================

# ==================== Logging ====================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet=INFO

# ==================== SQL Performance Tracking ====================
# Uncomment to count queries when debugging N+1 (adds latency — keep off in normal runs)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
# ============================================================

# Log all requests and responses
spring.web.log-request-details=false

# Disable Spring Security's default headers to see more details
spring.security.filter.dispatcher-types=request,error,async,forward

# ==================== CORS Configuration ====================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed.headers=*
cors.exposed.headers=Authorization,Content-Type
cors.allow.credentials=true
cors.max.age=3600
# ===============================================

# ==================== Plate Recognizer OCR ====================
# Đăng ký tại https://platerecognizer.com/
plate-recognizer.api-url=https://api.platerecognizer.com/v1/plate-reader/
plate-recognizer.api-key=${PLATE_RECOGNIZER_API_KEY:}
plate-recognizer.regions=vn
plate-recognizer.timeout-seconds=30
# ===============================================

# ==================== Mail Configuration ====================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# ===============================================

# ==================== Application Logging ====================
# INFO for framework; DEBUG only for app package when needed
logging.level.root=INFO
logging.level.fpt.swp391.parkingmanagement=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Tắt log job spam (job chạy mỗi phút)
logging.level.fpt.swp391.parkingmanagement.job=INFO
logging.level.org.springframework.scheduling=INFO
logging.level.org.springframework.boot.autoconfigure=WARN

# Format có màu + thread (dễ phân biệt request vs job)
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5p) [%15.15t] %cyan(%-40.40logger{39}) : %m%n

# Ghi log ra file để track sau
logging.file.name=logs/parking-app.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %-40.40logger{39} : %m%n
# ================================================
