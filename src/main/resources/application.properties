spring.application.name=parkingmanagement

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/parking_db
spring.datasource.username=root
spring.datasource.password=123456
# Schema from src/main/resources/db/parking_db.sql — do not auto-alter (avoids FK ALTER warnings)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=8f4a1b9c2d7e6f5a4b3c2d1e9f8a7b6c123456789abcdef
jwt.expiration=86400000
#Cloudiary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# WebSocket
spring.websocket.path=/ws

# Logging (INFO = less noise; set DEBUG when troubleshooting)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet=INFO

# Log all requests and responses
spring.web.log-request-details=true

# Disable Spring Security's default headers to see more details
spring.security.filter.dispatcher-types=request,error,async,forward
